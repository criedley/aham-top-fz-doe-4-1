[project]
name = "aham-top-fz-doe-4-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "criedley", email = "conner.riedley@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pip>=26.2.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[project.scripts]
aham-top-fz-doe-4-1 = "aham_top_fz_doe_4_1:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
