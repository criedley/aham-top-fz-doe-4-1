<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>AHAM Test Setup</title>
</head>

<body>
    <h1>Technician Input &mdash; Channel Assignment</h1>
    {% if error %}<p class="error" style="color:#b00020"><strong>{{ error }}</strong></p>{% endif %}

    <form action="/submit" method="post">
        <input type="hidden" name="csv_path" value="{{ csv_path }}">

        <h2>Required Channels</h2>
        {% for role in required_roles %}
        <p><label>{{ role }}
                <select name="{{ role }}" required>
                    <option value="">-- select channel --</option>
                    {% for col in columns %}
                    <option value="{{ col }}" {% if selected.get(role)==col %}selected{% endif %}>{{ col }}</option>
                    {% endfor %}
                </select></label></p>
        {% endfor %}

        <h2>Optional Channels</h2>
        {% for role in optional_roles %}
        <p><label>{{ role }}
                <select name="{{ role }}">
                    <option value="NA">NA</option>
                    {% for col in columns %}
                    <option value="{{ col }}" {% if selected.get(role)==col %}selected{% endif %}>{{ col }}</option>
                    {% endfor %}
                </select></label></p>
        {% endfor %}

        <h2>Test Parameters</h2>
        <p><label>Unit Height (inches, as entered on the Data Sheet; 10 in. thermocouple offset is added automatically)
                <input type="number" name="height_in" step="any" min="0" required
                    value="{{ params.get('height_in', '') }}"></label></p>
        <p><label>CT Value
                <input type="number" name="ct" step="any" min="0" required value="{{ params.get('ct', '') }}"></label>
        </p>
        <p><label><input type="checkbox" name="fz_only"> Freezer Only</label></p>
        <p><label>K-Factor
                <select name="fz_only_kfactor">
                    {% for k in ["1", "0.85", "0.7"] %}
                    <option value="{{ k }}" {% if params.get('fz_only_kfactor', '1' )==k %}selected{% endif %}>{{ k }}
                    </option>
                    {% endfor %}
                </select></label></p>
        <p><label><input type="checkbox" name="adjusted_start"> Adjust Start Time</label>
            <input type="datetime-local" name="time_to_start" value="{{ params.get('time_to_start', '') }}">
        </p>

        <button type="submit">Run Analysis</button>
    </form>
</body>

</html>
